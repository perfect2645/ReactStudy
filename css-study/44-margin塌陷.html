<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      /* div[class^="box"] {
      } */

      .box-parent {
        width: 300px;
        height: 300px;
        background-color: pink;

        /* 父盒子加border或者padding */
        padding-top: 1px;
      }

      .box-child {
        width: 100px;
        height: 100px;
        background-color: green;

        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="box-parent">
      <div class="box-child"></div>
    </div>
  </body>
</html>
