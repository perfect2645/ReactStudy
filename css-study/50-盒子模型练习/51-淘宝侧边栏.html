<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./font_cltzoaug4ai/iconfont.js"></script>
    <link rel="stylesheet" href="./font_cltzoaug4ai/iconfont.css" />
    <title>Document</title>
    <style>
      .icon {
        width: 1em;
        height: 1em;
        vertical-align: -0.15em;
        fill: currentColor;
        overflow: hidden;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      ul {
        list-style: none;
      }

      a {
        color: #1f1f1f;
        text-decoration: none;
      }

      main {
        width: 390px;
        height: 610px;

        margin: 40px auto;
        padding: 20px;

        background-color: #eee;

        border-radius: 20px;
      }

      main header {
        display: flex;
        justify-content: start;
        gap: 20px;
      }

      main header h2:last-child {
        color: red;
      }

      main .banner h3 {
        padding: 6px 0;
        background-color: #fff;

        font-size: 24px;
        text-align: center;
        color: #e69783;
      }

      .content {
        padding: 10px;

        font-size: 24px;
      }

      .content .link-list li {
        transition: all 0.3s;
      }

      .content .link-list li:hover {
        background-color: #fff;
      }

      .content .link-list li a {
        font-size: 22px;
        transition: all 0.3s;
      }

      .content .link-list li a:hover {
        color: #ff5000;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h2>分类</h2>
        <h2>超级88</h2>
      </header>
      <div class="banner">
        <h3>
          <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-huore"></use>
          </svg>
          <span>超级88大促 / 抢省钱补贴</span>
        </h3>
      </div>
      <div class="content">
        <ul class="link-list">
          <li>
            <svg class="icon" aria-hidden="true">
              <use xlink:href="#icon-diannao"></use>
            </svg>
            <a href="https://www.taobao.com/">电脑</a>
            <span> / </span>
            <a href="https://www.taobao.com/">配件</a>
            <span> / </span>
            <a href="https://www.taobao.com/">办公</a>
            <span> / </span>
            <a href="https://www.taobao.com/">文具</a>
          </li>
          <li>
            <a href="https://www.taobao.com/">工业品</a>
            <span> / </span>
            <a href="https://www.taobao.com/">商业</a>
            <span> / </span>
            <a href="https://www.taobao.com/">农业</a>
            <span> / </span>
            <a href="https://www.taobao.com/">定制</a>
          </li>
          <li>
            <a href="https://www.taobao.com/">家电</a>
            <span> / </span>
            <a href="https://www.taobao.com/">手机</a>
            <span> / </span>
            <a href="https://www.taobao.com/">通信</a>
            <span> / </span>
            <a href="https://www.taobao.com/">数码</a>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
